<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 증권사 관제 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#EEF0F3; --surface:#FFFFFF; --ink:#10141A; --muted:#6B7480;
    --line:#D8DDE4; --buy:#C62F2A; --buy-soft:#FBECEB; --sell:#1B54A8; --sell-soft:#E9F0FA;
    --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a,button,select,input{font-family:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .bar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;
       display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-weight:400;margin-left:8px;font-size:13px}
  .bar-spacer{flex:1}
  .field{display:flex;align-items:center;gap:6px}
  label{color:var(--muted);font-size:12px}
  select,input[type=text],input[type=password],input[type=number]{background:var(--surface);
       border:1px solid var(--line);border-radius:3px;padding:7px 9px;font-size:13px;color:var(--ink)}
  input[type=number]{font-family:var(--mono);text-align:right}
  button{border:1px solid var(--line);background:var(--surface);color:var(--ink);
       border-radius:3px;padding:7px 13px;font-size:13px;cursor:pointer}
  button:hover{border-color:#A9B2BD}
  .token{font-family:var(--mono);font-size:12px;color:var(--muted);
       background:var(--ground);border:1px solid var(--line);border-radius:3px;padding:6px 9px;
       max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .wrap{max-width:1240px;margin:0 auto;padding:20px;display:grid;gap:16px;
        grid-template-columns:340px 1fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
  .card > h2{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);
        font-size:13px;font-weight:600;letter-spacing:-.01em}
  .card-body{padding:16px}
  .full{grid-column:1 / -1}

  .pad-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .pad-row input,.pad-row select{width:190px}
  .price-field{display:flex;gap:6px;width:190px}
  .price-field input{width:auto;flex:1;min-width:0}
  .price-field button{padding:7px 9px;font-size:12px;white-space:nowrap}
  .limit-hint{font-size:12px;color:var(--muted);margin:-3px 0 11px;font-family:var(--mono)}
  .limit-hint.over{color:var(--buy)}
  .est{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);
       margin-top:4px;color:var(--muted);font-size:13px}
  .est strong{font-family:var(--mono);font-weight:500;color:var(--ink)}
  .side-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .side-btns button{padding:15px 0;font-size:15px;font-weight:600;color:#fff;border:none;border-radius:3px}
  .b-buy{background:var(--buy)} .b-buy:hover{background:#A82521}
  .b-sell{background:var(--sell)} .b-sell:hover{background:#164389}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .stat{padding:14px 16px;border-right:1px solid var(--line)}
  .stat:last-child{border-right:none}
  .stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:500;margin-top:2px}
  .stat small{color:var(--muted);font-size:12px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:right;color:var(--muted);font-weight:400;font-size:12px;
     padding:9px 16px;border-bottom:1px solid var(--line);background:#F7F8FA}
  td{padding:10px 16px;border-bottom:1px solid #EDF0F3;text-align:right;
     font-family:var(--mono);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;font-family:var(--sans)}
  tbody tr:last-child td{border-bottom:none}
  .up{color:var(--buy)} .down{color:var(--sell)}
  .empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}

  /* 체결 테이프 — HTS 체결창을 본뜬 이 콘솔의 중심 요소 */
  .tape{font-family:var(--mono);font-size:13px;max-height:260px;overflow-y:auto}
  .tape-row{display:grid;grid-template-columns:104px 58px 1fr 78px 104px 116px;
     gap:12px;padding:9px 16px;border-bottom:1px solid #EDF0F3;align-items:center}
  .tape-row:last-child{border-bottom:none}
  .tape-row > span:nth-child(n+4){text-align:right}
  .tape-head{color:var(--muted);font-size:12px;background:#F7F8FA;
     border-bottom:1px solid var(--line);font-family:var(--sans)}
  .tag{display:inline-block;padding:2px 7px;border-radius:2px;font-size:12px;font-weight:500}
  .tag-buy{background:var(--buy-soft);color:var(--buy)}
  .tag-sell{background:var(--sell-soft);color:var(--sell)}
  .tape-name{font-family:var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fresh{animation:slide .35s ease-out}
  @keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fresh{animation:none}}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
     background:var(--ink);color:#fff;padding:11px 18px;border-radius:4px;font-size:13px;
     opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  .toast.show{opacity:1}
  .toast.err{background:var(--buy)}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;padding:14px}
    .stats{grid-template-columns:1fr}
    .stat{border-right:none;border-bottom:1px solid var(--line)}
    .tape-row{grid-template-columns:1fr 1fr;gap:6px}
    .tape-row > span:nth-child(n+4){text-align:left}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">가상 증권사 관제 콘솔 <span id="orgLabel">로그인 필요</span></div>
  <div class="bar-spacer"></div>
  <div class="field">
    <label for="loginIdInput">아이디</label>
    <input type="text" id="loginIdInput" autocomplete="username">
  </div>
  <div class="field">
    <label for="loginPwInput">비밀번호</label>
    <input type="password" id="loginPwInput" autocomplete="current-password">
  </div>
  <div class="field" id="signupKeyField" style="display:none">
    <label for="signupKeyInput">암호키</label>
    <input type="password" id="signupKeyInput">
  </div>
  <label class="field" style="cursor:pointer">
    <input type="checkbox" id="signupToggle"> 회원가입
  </label>
  <button id="loginBtn">로그인</button>
  <button id="resetBtn">초기 상태로</button>
  <button id="refreshPriceBtn" title="네이버 금융 시세로 현재가를 다시 맞춥니다">시세 새로고침</button>
  <div class="token" id="tokenBox" title="접근토큰">접근토큰 없음</div>
  <button id="copyBtn">토큰 복사</button>
</header>

<main class="wrap">

  <section class="card">
    <h2>주문</h2>
    <div class="card-body">
      <div class="pad-row">
        <label for="accountSel">계좌</label>
        <select id="accountSel"></select>
      </div>
      <div class="pad-row">
        <label for="prodSel">종목</label>
        <select id="prodSel"></select>
      </div>
      <div class="pad-row">
        <label for="qtyInput">수량</label>
        <input type="number" id="qtyInput" value="10" min="1" step="1">
      </div>
      <div class="limit-hint" id="holdingHint"></div>
      <div class="pad-row">
        <label for="priceInput">단가</label>
        <span class="price-field">
          <input type="number" id="priceInput" min="1" step="1">
          <button type="button" id="useMarketPriceBtn" title="현재가를 그대로 채웁니다">현재가</button>
        </span>
      </div>
      <div class="limit-hint" id="limitHint"></div>
      <div class="pad-row">
        <label for="pastTradeToggle">과거 거래로 등록</label>
        <input type="checkbox" id="pastTradeToggle">
      </div>
      <div class="pad-row" id="pastTradeRow" style="display:none">
        <label for="pastTradeInput">거래일시</label>
        <input type="datetime-local" id="pastTradeInput">
      </div>
      <div class="limit-hint" id="pastTradeHint" style="display:none">과거 거래는 가격제한폭 검사 없이 그대로 등록되고, 종목 현재가도 바뀌지 않습니다.</div>
      <div class="est">
        <span>주문금액</span><strong id="estAmt">0</strong>
      </div>
      <div class="side-btns">
        <button class="b-buy" id="buyBtn">매수</button>
        <button class="b-sell" id="sellBtn">매도</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>계좌 현황</h2>
    <div class="stats">
      <div class="stat"><small>예수금</small><b id="statCash">0</b></div>
      <div class="stat"><small>주식 평가금액</small><b id="statEval">0</b></div>
      <div class="stat"><small>총 자산</small><b id="statTotal">0</b></div>
    </div>
    <table>
      <thead>
        <tr><th>종목</th><th>보유수량</th><th>평균단가</th><th>현재가</th><th>평가금액</th><th>평가손익</th></tr>
      </thead>
      <tbody id="holdingBody"></tbody>
    </table>
  </section>

  <section class="card full">
    <h2>체결 테이프</h2>
    <div class="tape-row tape-head">
      <span>거래번호</span><span>구분</span><span>종목</span>
      <span>수량</span><span>단가</span><span>정산금액</span>
    </div>
    <div class="tape" id="tape"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const won = v => Number(v).toLocaleString('ko-KR');
let state = null;
let latestTransNo = null;
let accessToken = null;

function toast(message, isError) {
  const el = $('toast');
  el.textContent = message;
  el.className = 'toast show' + (isError ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 3200);
}

async function call(url, options) {
  options = options || {};
  const headers = Object.assign({}, options.headers);
  if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
  const res = await fetch(url, Object.assign({}, options, { headers }));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.rsp_msg || ('요청이 실패했습니다 (' + res.status + ')'));
  return data;
}

function renderTape(transactions) {
  const rows = transactions.map(t => {
    const isBuy = t.transType === '101';
    const fresh = t.transNo === latestTransNo ? ' fresh' : '';
    const time = t.transDtime.slice(4, 6) + '/' + t.transDtime.slice(6, 8) + ' ' +
                 t.transDtime.slice(8, 10) + ':' + t.transDtime.slice(10, 12);
    return `<div class="tape-row${fresh}">
      <span title="${t.transNo}">${time}</span>
      <span><em class="tag ${isBuy ? 'tag-buy' : 'tag-sell'}">${isBuy ? '매수' : '매도'}</em></span>
      <span class="tape-name">${t.prodName}</span>
      <span>${won(t.transNum)}</span>
      <span>${won(t.baseAmt)}</span>
      <span>${won(t.settleAmt)}</span>
    </div>`;
  }).join('');
  $('tape').innerHTML = rows || '<div class="empty">아직 체결된 거래가 없습니다.</div>';
}

function renderHoldings(holdings) {
  if (!holdings.length) {
    $('holdingBody').innerHTML = '<tr><td colspan="6" class="empty">보유 중인 종목이 없습니다.</td></tr>';
    return;
  }
  $('holdingBody').innerHTML = holdings.map(h => {
    const pnl = Number(h.pnl);
    const cls = pnl > 0 ? 'up' : (pnl < 0 ? 'down' : '');
    const sign = pnl > 0 ? '+' : '';
    return `<tr>
      <td>${h.prodName}</td><td>${won(h.holdingNum)}</td><td>${won(h.avgPrice)}</td>
      <td>${won(h.currentPrice)}</td><td>${won(h.evalAmt)}</td>
      <td class="${cls}">${sign}${won(pnl)}</td>
    </tr>`;
  }).join('');
}

/** 코스피 종목 코드·이름 목록. 로그인 직후 한 번만 불러온다 — 값이 안 바뀌므로 매번 다시 그릴 필요 없다. */
async function loadProducts() {
  const data = await call('/mock/products');
  $('prodSel').innerHTML = data.products
    .map(p => `<option value="${p.prodCode}">${p.prodName} (${p.prodCode})</option>`).join('');
}

async function refresh(accountNum) {
  const query = accountNum ? ('?accountNum=' + encodeURIComponent(accountNum)) : '';
  state = await call('/mock/state' + query);

  $('orgLabel').textContent = state.orgName;

  const accSel = $('accountSel');
  accSel.innerHTML = state.accounts
    .map(a => `<option value="${a.accountNum}">${a.accountName} (${a.accountNum})</option>`).join('');
  accSel.value = state.selectedAccountNum;

  const cash = Number(state.cashBalance), evalAmt = Number(state.totalEvalAmt);
  $('statCash').textContent = won(cash);
  $('statEval').textContent = won(evalAmt);
  $('statTotal').textContent = won(cash + evalAmt);

  renderHoldings(state.holdings);
  renderTape(state.transactions);
  syncHoldingHint();
}

const PRICE_LIMIT_RATE = 0.30;
let priceBasis = 0;

/** 선택된 종목의 현재가를 그때그때 조회한다 (이미 활성화된 적 있으면 저장값, 처음이면 실시간 조회). */
async function syncPrice() {
  const prodCode = $('prodSel').value;
  if (!prodCode) return;
  const data = await call('/mock/prices/' + encodeURIComponent(prodCode));
  priceBasis = Number(data.currentPrice);
  $('priceInput').value = priceBasis;
  syncHoldingHint();
  syncEstimate();
}

function syncHoldingHint() {
  if (!state) return;
  const prodCode = $('prodSel').value;
  const held = state.holdings.find(h => h.prodCode === prodCode);
  $('holdingHint').textContent = held
    ? `보유 ${won(held.holdingNum)}주 (평균단가 ${won(held.avgPrice)}원)`
    : '보유 없음';
}

function syncEstimate() {
  const price = Number($('priceInput').value) || 0;
  const amount = (Number($('qtyInput').value) || 0) * price;
  $('estAmt').textContent = won(amount);

  const isPastTrade = $('pastTradeToggle').checked;
  $('limitHint').style.display = isPastTrade ? 'none' : '';
  $('pastTradeHint').style.display = isPastTrade ? '' : 'none';
  if (isPastTrade) return;

  if (priceBasis > 0) {
    const upper = Math.floor(priceBasis * (1 + PRICE_LIMIT_RATE));
    const lower = Math.ceil(priceBasis * (1 - PRICE_LIMIT_RATE));
    const hint = $('limitHint');
    hint.textContent = `현재가 ${won(priceBasis)} · 허용범위 ${won(lower)} ~ ${won(upper)}`;
    hint.classList.toggle('over', price > 0 && (price > upper || price < lower));
  }
}

/** datetime-local 값("YYYY-MM-DDTHH:mm")을 서버가 받는 yyyyMMddHHmmss로 바꾼다. */
function tradedAtValue() {
  if (!$('pastTradeToggle').checked) return null;
  const raw = $('pastTradeInput').value;
  if (!raw) return null;
  const digits = raw.replace(/[^0-9]/g, '');
  return digits.length === 12 ? digits + '00' : digits;
}

async function order(side) {
  if (!accessToken) return toast('먼저 로그인하세요.', true);
  const tradedAt = tradedAtValue();
  if ($('pastTradeToggle').checked && !tradedAt) return toast('과거 거래일시를 입력하세요.', true);
  try {
    const result = await call('/mock/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        accountNum: $('accountSel').value,
        prodCode: $('prodSel').value,
        side: side,
        quantity: Number($('qtyInput').value),
        price: Number($('priceInput').value),
        tradedAt: tradedAt
      })
    });
    latestTransNo = result.transNo;
    await refresh($('accountSel').value);
    await syncPrice();
    const when = tradedAt ? ` (거래일시 ${result.transDtime})` : '';
    toast(`${result.prodName} ${won(result.quantity)}주 ${side === 'BUY' ? '매수' : '매도'} 체결${when} · 거래번호 ${result.transNo}`);
  } catch (e) {
    toast(e.message, true);
  }
}

$('buyBtn').onclick = () => order('BUY');
$('sellBtn').onclick = () => order('SELL');
$('prodSel').onchange = () => syncPrice().catch(e => toast(e.message, true));
$('accountSel').onchange = () => refresh($('accountSel').value).catch(e => toast(e.message, true));
$('qtyInput').oninput = syncEstimate;
$('priceInput').oninput = syncEstimate;
$('useMarketPriceBtn').onclick = () => { $('priceInput').value = priceBasis; syncEstimate(); };
$('pastTradeToggle').onchange = () => {
  $('pastTradeRow').style.display = $('pastTradeToggle').checked ? 'flex' : 'none';
  syncEstimate();
};

$('signupToggle').onchange = () => {
  const signup = $('signupToggle').checked;
  $('signupKeyField').style.display = signup ? 'flex' : 'none';
  $('loginBtn').textContent = signup ? '회원가입' : '로그인';
};

$('loginBtn').onclick = async () => {
  const signup = $('signupToggle').checked;
  const payload = {
    loginId: $('loginIdInput').value,
    loginPassword: $('loginPwInput').value
  };
  if (signup) payload.systemKey = $('signupKeyInput').value;
  try {
    const data = await call(signup ? '/mock/auth/register' : '/mock/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    accessToken = data.accessToken;
    $('tokenBox').textContent = accessToken;
    $('loginPwInput').value = '';
    $('signupKeyInput').value = '';
    latestTransNo = null;
    await loadProducts();
    await refresh();
    await syncPrice();
    toast((signup ? '회원가입 완료 · ' : '') + data.orgName + '에 로그인했습니다.');
  } catch (e) { toast(e.message, true); }
};

$('resetBtn').onclick = async () => {
  if (!accessToken) return toast('먼저 로그인하세요.', true);
  try {
    await call('/mock/reset', { method: 'POST' });
    latestTransNo = null;
    await refresh();
    await syncPrice();
    toast('초기 상태로 되돌렸습니다.');
  } catch (e) { toast(e.message, true); }
};

$('refreshPriceBtn').onclick = async () => {
  if (!accessToken) return toast('먼저 로그인하세요.', true);
  try {
    const data = await call('/mock/prices/refresh', { method: 'POST' });
    await refresh($('accountSel').value);
    await syncPrice();
    toast(`${data.updatedCount}개 종목 시세를 갱신했습니다.` +
      (data.failedCount ? ` (조회 실패 ${data.failedCount}건)` : ''));
  } catch (e) { toast(e.message, true); }
};

$('copyBtn').onclick = async () => {
  if (!accessToken) return toast('먼저 로그인해서 접근토큰을 발급하세요.', true);
  try {
    await navigator.clipboard.writeText(accessToken);
    toast('접근토큰을 복사했습니다.');
  } catch (e) { toast('복사에 실패했습니다. 직접 선택해 복사하세요.', true); }
};

(async function start() {
  // 로그인 전에는 할 게 없다 — 로그인하면 refresh()가 상태를 채운다.
})();
</script>
</body>
</html>
