plugins {
    id 'war'
}

group = 'com.investory'
version = '1.0.0'
description = '마이데이터 금융투자 업권 규격을 모방한 가상 증권사 서버 (데모용)'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.13'
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    jacksonVersion = '2.17.2'
}

dependencies {
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"

    // 비밀번호 해시(BCrypt)만 쓴다. 전체 spring-security-web/config(필터체인, 세션관리)는
    // 이 목업 서버 규모에 비해 과한 데다, Spring Security 6.x부터는 jakarta.servlet 기반이라
    // 지금 Spring Framework 5.3(javax.servlet) 스택과도 맞지 않는다.
    implementation "org.springframework.security:spring-security-crypto:${springSecurityVersion}"

    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.zaxxer:HikariCP:4.0.3'

    // 스키마는 schema.sql이 아니라 db/migration의 버전드 마이그레이션으로 관리한다.
    implementation 'org.flywaydb:flyway-core:11.8.2'
    implementation 'org.flywaydb:flyway-mysql:11.8.2'

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    implementation 'ch.qos.logback:logback-classic:1.2.13'

    // war 플러그인이 제공하는 설정. Maven의 <scope>provided</scope>와 동일하게
    // 컴파일에는 포함하되 war 패키징에서는 제외한다 (톰캣이 이미 갖고 있으므로).
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    // Tomcat 9 lib/annotations-api.jar 가 런타임에 @PostConstruct 등 JSR-250 어노테이션을 제공한다.
    // 컴파일 시점에만 필요하므로 war에는 포함하지 않는다.
    providedCompile 'javax.annotation:javax.annotation-api:1.3.2'
}

war {
    archiveFileName = 'investory-mock-broker.war'
}
